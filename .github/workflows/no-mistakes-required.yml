name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  # Trusted base owns the decision code. Candidate code runs only in the
  # token-free, network-free sandbox, never directly on this runner.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Read trusted base qualification code
        if: github.repository == 'ayrton-saunders/firstmate'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Qualify focused canonical integration or select native verification
        if: github.repository == 'ayrton-saunders/firstmate'
        id: focused
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FM_FOCUSED_EVIDENCE: ${{ runner.temp }}/focused-evidence
        run: python3 .github/verify-focused-upstream.py --workflow
      - name: Retain fresh focused qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/focused-evidence
          if-no-files-found: ignore
      - name: Verify no-mistakes signature and pipeline attestation
        if: github.repository != 'ayrton-saunders/firstmate' || steps.focused.outputs.route == 'native'
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@f6441c96c352a18b9cadcaef6b6c7017e9ac3970 # v1.80.1
        with:
          exempt-authors: kunchenguid
